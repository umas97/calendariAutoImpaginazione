[project]
name = "calendariautoimpaginazione"
version = "0.1.0"
description = "Calendario dei gruppi parrocchiali con fogli A4 da distribuire"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "umas97" }]
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "pillow>=11.0",
    "pypdfium2>=4.30",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
    "weasyprint>=63",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "httpx2>=2.13.1",
]

[project.scripts]
calendariautoimpaginazione = "cp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/cp"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
# The budgets of SPEC §14 (test 27) are slow: only with `-m bench` (tests/bench/).
addopts = "-m 'not bench'"
markers = ["bench: measures of SPEC §14, run on their own with -m bench"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]
# Markdown too: recent ruff formats code blocks inside .md, and the SPEC is prose.
extend-exclude = ["frontend", "packaging", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
